{% extends "base.html" %}

{% block extrahead %}
  {% set page_title = page.title ~ " | " ~ config.site_name if page.title and not page.is_homepage else config.site_name %}
  {% set page_desc = page.meta.description if page.meta and page.meta.description else config.site_description %}
  <link rel="canonical" href="{{ page.canonical_url }}">
  <meta name="description" content="{{ page_desc }}">
  <meta name="author" content="{{ config.extra.author_name }}">
  <meta name="keywords" content="LLM daydreaming, day-dreaming loop, Gwern, daydreamd, Obsidian, Claude Code, preregistered evaluation, computational creativity, idea generation">
  <meta property="og:image" content="https://caraulani.github.io/llm-daydreaming/assets/hero.png">
  <meta name="twitter:image" content="https://caraulani.github.io/llm-daydreaming/assets/hero.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_desc }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ page_desc }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "{{ config.extra.author_url }}",
        "name": "{{ config.extra.author_name }}",
        "url": "{{ config.extra.author_url }}",
        "sameAs": ["https://orcid.org/0009-0006-3889-3563", 
          "{{ config.extra.author_url }}",
          "https://doi.org/{{ config.extra.doi_concept }}"
        ]
      },
      {
        "@type": "SoftwareSourceCode",
        "@id": "{{ config.repo_url }}",
        "name": "daydreamd",
        "alternateName": "llm-daydreaming",
        "description": "{{ config.site_description }}",
        "url": "{{ config.site_url }}",
        "codeRepository": "{{ config.repo_url }}",
        "programmingLanguage": "Python",
        "runtimePlatform": "Python 3.12",
        "license": "https://opensource.org/licenses/MIT",
        "version": "{{ config.extra.version }}",
        "dateModified": "2026-09-14",
        "author": { "@id": "{{ config.extra.author_url }}" },
        "identifier": {
          "@type": "PropertyValue",
          "propertyID": "DOI",
          "value": "{{ config.extra.doi_concept }}",
          "url": "https://doi.org/{{ config.extra.doi_concept }}"
        },
        "keywords": ["LLM daydreaming", "day-dreaming loop", "Gwern", "Obsidian", "Claude Code", "computational creativity", "idea generation", "preregistered evaluation", "local-first daemon"]
      },
      {
        "@type": "ScholarlyArticle",
        "@id": "{{ config.site_url }}paper/",
        "headline": "{{ config.extra.paper_title }}",
        "name": "{{ config.extra.paper_title }}",
        "url": "{{ config.site_url }}paper/",
        "datePublished": "2026-09-14",
        "inLanguage": "en",
        "author": { "@id": "{{ config.extra.author_url }}" },
        "license": "https://creativecommons.org/licenses/by/4.0/",
        "identifier": {
          "@type": "PropertyValue",
          "propertyID": "DOI",
          "value": "{{ config.extra.doi_v020 }}",
          "url": "https://doi.org/{{ config.extra.doi_v020 }}"
        },
        "isPartOf": { "@id": "{{ config.repo_url }}" },
        "about": ["LLM daydreaming loop", "selection of machine-generated ideas", "planted-bridge recovery evaluation"],
        "keywords": ["LLM daydreaming", "day-dreaming loop", "preregistration", "permutation null", "synthetic corpus"]
      }
    ]
  }
  </script>
{% endblock %}
