  - id: br23
    domain_a: iot
    domain_b: fraud
    hidden_mechanism: accepting a message whose timestamp is far from now lets stale or replayed messages corrupt the system
    gold_connection: >-
      Both systems accept messages whose timestamp is nowhere near the current time: a sensor
      with a reset clock corrupted the daily rollup with 2024 readings, and callers reuse a
      signed ticket days after it was issued; both need a freshness window.
    gold_implication: >-
      Reject any signed call ticket older than five minutes and any sensor packet whose
      timestamp is more than ten minutes from server time, then count rejections for a week.
    ingredients_a:
      - a sensor whose clock reset sent readings stamped with a date in 2024
      - the server stored them and the daily rollup for that date changed
      - the packets were otherwise well formed and signed correctly
    ingredients_b:
      - the same signed call ticket was presented for a new call three days after it was issued
      - the server accepted it because the signature verified
      - the ticket carries the time it was issued
    forbidden_phrases_a: [replay, freshness, stale, expiry, reject old]
    forbidden_phrases_b: [replay, freshness, stale, expiry, reject old, sensor]
    one_side_test: >-
      A alone reads as a clock bug; B alone reads as a ticket accepted on signature. Neither
      says a valid message can still be too old to accept.
  - id: br24
    domain_a: iot
    domain_b: fraud
    hidden_mechanism: the accounts and devices still on factory defaults are the ones that get taken over
    gold_connection: >-
      The population still on the factory default is the one that gets compromised: the
      camera on the default password showed up on a public scanner, and the accounts taken
      over all had the default PIN; forcing a change at setup closes both.
    gold_implication: >-
      List every device and every account still on its default credential and force a change
      on first use, then compare takeovers over the next quarter.
    ingredients_a:
      - half the workshop cameras still use the password printed on the box
      - one of them appeared in a public device search engine last week
      - the cameras that were renamed and reconfigured did not appear
    ingredients_b:
      - the fourteen accounts taken over last month all had the PIN left at 0000
      - setup lets users skip choosing a PIN
      - accounts with a chosen PIN had no takeovers in the same month
    forbidden_phrases_a: [default credential, takeover, force change, weak password, exposed]
    forbidden_phrases_b: [default credential, force change, weak password, camera, device]
    one_side_test: >-
      A alone reads as a camera exposure; B alone reads as PIN statistics. Neither says the
      unchanged-default population is the target across both.
