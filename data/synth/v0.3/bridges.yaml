# Planted bridges, corpus v0.3 (ground truth by construction). Authored by the experimenter with
# Claude as a disclosed writing assistant, 2026-09-14, after the v0.2 review
# (research/07-adversarial-review-v0.2-results-2026-09-14.md) and ADR-014, before any v0.3 note
# existed.
#
# What changed from v0.2: every ingredient is a SPECIFIC FACT about this builder's situation
# (an identifier pattern, a date coincidence, a measured number, a named vendor quirk, a place,
# an order of events), never an instance of a named principle. The mechanism is only stateable
# from the CONJUNCTION of the two notes; a reader of one side, even an expert, gets a local
# observation and nothing more. Templates: v0.2 br09 (sequential identifiers) and br17
# (expectation-lag dropout), the only two v0.2 bridges that needed both sides. New field
# `fact_type` (identifier | date | number | vendor | location | sequence). `one_side_test` is
# two sentences: what side A alone supports; what side B alone supports. The build runs the
# ADR-014 one-side gate (`daydreamd synth --one-side-gate`) on every bridge note.
#
# Pair balance as in v0.2: every one of the 15 domain pairs appears at least once and the 9 pairs
# between {ecom, grants, iot} and {mleval, fraud, health} appear twice, so every domain carries
# exactly 8 bridge notes.
persona: >
  A solo builder who runs a small e-commerce store, evaluates LLM systems for clients, handles
  payments fraud on a calling app, follows a personal health protocol, applies for EU grants,
  and tinkers with IoT sensors in a workshop. Notes are terse working memory, not essays.
domains:
  ecom: e-commerce store operations
  mleval: evaluation of LLM systems
  fraud: payments fraud on a consumer app
  health: personal health protocols and tracking
  grants: EU grant fundraising
  iot: hardware and IoT sensors in a workshop
bridges:
  - id: br01
    domain_a: ecom
    domain_b: fraud
    fact_type: identifier
    hidden_mechanism: the numbered postbin.io mailbox batch that redeemed the store promo is the same scripted account batch that signed up on the app
    gold_connection: >-
      The 41 promo redemptions and the 44 app signups on 3 May came from one scripted batch of
      postbin.io mailboxes numbered 0408 to 0451, so the two products were hit by the same
      operator and the store's promo log is a ready-made blocklist for the app.
    gold_implication: >-
      Join the store's SPRING24 customer emails with the app's 3 May signups on the local part,
      confirm the overlap, and block the postbin.io four-digit-suffix pattern at both signups.
    ingredients_a:
      - SPRING24 was redeemed 41 times on 3 May, all between 02:05 and 02:45
      - every one of the 41 customer emails is at postbin.io with a four-digit number before the at sign, 0410 through 0451
      - all 41 orders picked the cheapest shipping and the cheapest item in the category
    ingredients_b:
      - 44 accounts signed up on 3 May between 02:10 and 02:40, each topped up exactly 5 euros
      - the emails are all at postbin.io and end in four digits from 0408 to 0451
      - none of the 44 has made a call since the top-up
    forbidden_phrases_a: [fraud, bot, script, batch, app, signup, same operator]
    forbidden_phrases_b: [promo, store, order, shipping, discount, same operator, script]
    one_side_test: >-
      A alone supports "a promo got farmed by throwaway mailboxes". B alone supports "a burst of
      dormant top-up accounts from one mail host". Only both notes put the same numbered batch
      on the same night across two unrelated products.
  - id: br02
    domain_a: ecom
    domain_b: fraud
    fact_type: number
    hidden_mechanism: the 30-euro low-value exemption switched on for the store applies to the whole merchant account, so the app's 29.90 top-ups ride the same exemption
    gold_connection: >-
      The store's 30-euro low-value authentication exemption enabled on 12 June covers the shared
      merchant account, which is why the app's 29.90 top-ups from new accounts exploded on the
      same day: attackers price just under the threshold that skips the extra check.
    gold_implication: >-
      Ask the processor whether the exemption is scoped per merchant account or per storefront,
      and compare app chargebacks on 29.90 top-ups before and after 12 June.
    ingredients_a:
      - low-value exemption turned on at 30 euros on 12 June to cut checkout friction
      - since then the only chargebacks are on orders between 27.00 and 29.99
      - the processor account is the same one the calling app bills through
    ingredients_b:
      - top-ups of exactly 29.90 went from 2 percent of volume to 31 percent starting 12 June
      - almost all 29.90 top-ups are first transactions on accounts under a day old
      - the 29.90 amount is not one of the app's four suggested top-up buttons
    forbidden_phrases_a: [threshold attack, exemption abuse, top-up, fraud, just under]
    forbidden_phrases_b: [exemption, 3DS, authentication, store, checkout, just under, threshold]
    one_side_test: >-
      A alone supports "chargebacks cluster near the exemption limit". B alone supports "an odd
      amount became popular with new accounts". Only both connect the store's setting date to
      the app's amount through the shared processor account.
  - id: br03
    domain_a: ecom
    domain_b: mleval
    fact_type: identifier
    hidden_mechanism: the description generator is evaluated on SKUs 1000 to 1199 and used only on SKUs 1200 and up, so the 4.6 score never touches the products that get returned
    gold_connection: >-
      The description generator's 4.6 score was measured on SKUs 1000 to 1199, the merchandiser's
      hand-picked set, while every generated description in production is for SKUs 1200 and up,
      the range where "not as described" returns tripled; the score and the returns never
      overlap.
    gold_implication: >-
      Re-run the description eval on a random 100 SKUs from 1200 upward and compare the score
      with the 4.6.
    ingredients_a:
      - 'returns tagged "not as described" for SKUs 1200 to 1399 run at 9 percent against 3 percent for older SKUs' 
      - SKUs 1200 and up were added after 3 July and their descriptions come from the generator
      - older SKUs kept their hand-written descriptions
    ingredients_b:
      - the description generator scores 4.6 out of 5 on the eval set
      - the eval set is the 200 SKUs 1000 to 1199 the merchandiser picked on 2 July
      - the eval set has not changed since it was built
    forbidden_phrases_a: [eval, evaluation, score, test set, generator quality, coverage]
    forbidden_phrases_b: [returns, not as described, production, coverage, disjoint, leakage]
    one_side_test: >-
      A alone supports "new SKUs get returned more". B alone supports "the generator scores
      well". Only both show the SKU ranges do not overlap.
  - id: br04
    domain_a: ecom
    domain_b: mleval
    fact_type: date
    hidden_mechanism: the vendor dashboard's quality score dropped on 19 August because the vendor swapped its judge snapshot that day, not because the store's reply model changed
    gold_connection: >-
      The 0.6 drop in the support-reply quality score on 19 August is the eval vendor's judge
      snapshot change of the same date, which moved reference-set scores by a similar amount;
      nothing about the store's replies changed.
    gold_implication: >-
      Re-score last week's replies with the previous judge snapshot pinned and check whether the
      0.6 gap disappears.
    ingredients_a:
      - the support-reply quality score on the vendor dashboard fell from 4.3 to 3.7 on 19 August
      - no deploy, prompt change or template change happened between 12 and 26 August
      - customer satisfaction on the same replies stayed at 91 percent
    ingredients_b:
      - the eval vendor's changelog says the default judge snapshot changed on 19 August
      - on the fixed 50-item reference set the new snapshot scores 0.5 lower on average
      - the vendor does not pin the snapshot unless asked
    forbidden_phrases_a: [judge, snapshot, eval vendor, artifact, measurement change]
    forbidden_phrases_b: [store, support replies, dashboard, artifact, the drop]
    one_side_test: >-
      A alone supports "quality fell with no known cause". B alone supports "the judge changed
      and scores shifted". Only both put the two on the same date.
  - id: br05
    domain_a: ecom
    domain_b: health
    fact_type: sequence
    hidden_mechanism: the Tuesday 06:30 dispatch cutoff introduced on 2 August is why every missed morning dose since then falls on a Tuesday
    gold_connection: >-
      The four missed morning doses since August all fall on Tuesdays because the new carrier
      contract from 2 August moved dispatch to a 06:30 cutoff, and the dose is scheduled at
      07:00, inside the packing rush.
    gold_implication: >-
      Move the dose to 06:00 on Tuesdays for four weeks and check whether the tracker shows any
      Tuesday miss.
    ingredients_a:
      - the new carrier contract from 2 August has a Tuesday 06:30 dispatch cutoff
      - Tuesday mornings are now packing from 05:45 to 06:30 without a break
      - the other weekdays keep the old 11:00 cutoff
    ingredients_b:
      - the tracker shows 4 missed morning doses in the 6 weeks since early August
      - all 4 misses are on Tuesdays
      - the dose reminder fires at 07:00 every day
    forbidden_phrases_a: [dose, protocol, tracker, health, reminder, missed]
    forbidden_phrases_b: [dispatch, carrier, store, packing, cutoff, orders]
    one_side_test: >-
      A alone supports "Tuesday mornings are busy now". B alone supports "doses get missed on
      Tuesdays". Only both put the packing window on top of the reminder time.
  - id: br06
    domain_a: ecom
    domain_b: health
    fact_type: vendor
    hidden_mechanism: FrostLine's 14:00 pickup runs on the van with the failing reefer, so both the store's cold-chain excursions and the cloudy vials trace to that slot
    gold_connection: >-
      The store's temperature excursions and the cloudy vials share one cause: FrostLine's 14:00
      pickup, which is the van whose reefer logs show warm periods; the 09:00 pickup on the same
      contract has none.
    gold_implication: >-
      Move both the store's cold-chain shipments and the vial deliveries to the 09:00 FrostLine
      slot for a month and compare excursion logs and vial condition.
    ingredients_a:
      - FrostLine handles the store's chilled shipments on two daily pickups, 09:00 and 14:00
      - the temperature loggers show excursions above 8 degrees only on parcels from the 14:00 pickup, four times in August
      - FrostLine says the 14:00 pickup uses their older van
    ingredients_b:
      - the last two vial deliveries arrived cloudy and were replaced
      - both were delivered by FrostLine and both were collected from the pharmacy in the afternoon
      - the earlier three deliveries, collected in the morning, were clear
    forbidden_phrases_a: [vial, pharmacy, health, protocol, cloudy, same van]
    forbidden_phrases_b: [store, shipment, excursion, logger, reefer, same van, 14:00]
    one_side_test: >-
      A alone supports "the afternoon pickup runs warm". B alone supports "afternoon vial
      deliveries arrive cloudy". Only both name the same courier slot as the shared cause.
  - id: br07
    domain_a: ecom
    domain_b: grants
    fact_type: identifier
    hidden_mechanism: the VAT number changed on 1 April, so the grant portal's SME check against the 2025 financials fails on an identifier mismatch, not on eligibility
    gold_connection: >-
      The grant portal rejects the SME declaration because the VAT number entered is the new one
      issued on 1 April while the 2025 financial statements it validates against carry the old
      number; the rejection is an identifier mismatch, not an eligibility problem.
    gold_implication: >-
      Resubmit the declaration with the old VAT number that appears on the 2025 accounts and
      attach the change notice, then check whether the validation passes.
    ingredients_a:
      - the store's VAT number changed on 1 April after the legal form change
      - invoices before April carry the old number ending 771, after April the new one ending 402
      - the 2025 annual accounts were filed under the old number
    ingredients_b:
      - the portal rejects the SME self-declaration with "financial data could not be validated"
      - the declaration was filled with the current VAT number ending 402
      - the same rejection appeared three times on three days
    forbidden_phrases_a: [grant, portal, declaration, SME, validation, mismatch]
    forbidden_phrases_b: [store, legal form change, old number, '771', mismatch, invoices]
    one_side_test: >-
      A alone supports "the company has a new VAT number". B alone supports "the portal will not
      validate the financials". Only both show the portal is checking the new number against
      accounts filed under the old one.
  - id: br08
    domain_a: ecom
    domain_b: iot
    fact_type: location
    hidden_mechanism: shelf C in the workshop overflow reads 78 percent humidity every night, and every warped board returned came from stock held on shelf C
    gold_connection: >-
      The warped boards all came from stock staged on shelf C of the workshop overflow, the
      shelf where the humidity sensor reads 78 percent every night, so the warping is storage,
      not a supplier defect.
    gold_implication: >-
      Move the remaining board stock off shelf C, keep the sensor there, and check whether the
      next 30 board orders produce any warping return.
    ingredients_a:
      - six boards came back as warped in August, all from the same supplier batch
      - the supplier's other batch, sold in July, had no returns
      - the August batch was staged in the workshop overflow area, shelf C, before shipping
    ingredients_b:
      - the humidity sensor on shelf C of the overflow area reads 76 to 79 percent between 23:00 and 06:00
      - shelves A and B stay under 60 percent all night
      - shelf C is against the outside wall next to the downpipe
    forbidden_phrases_a: [humidity, sensor, damp, moisture, wall, storage caused]
    forbidden_phrases_b: [boards, warped, returns, supplier, store, stock]
    one_side_test: >-
      A alone supports "one supplier batch warped". B alone supports "shelf C is damp at night".
      Only both place the warped batch on the damp shelf.
  - id: br09
    domain_a: grants
    domain_b: mleval
    fact_type: number
    hidden_mechanism: the agency's automated pre-screen scores every criterion 3.5 when the proposal exceeds its input limit, which the two 61-page proposals did
    gold_connection: >-
      The identical 3.5 scores on every criterion of both proposals are the flat output the
      screening judge produces on inputs past its length limit, and both proposals were 61
      pages; the scores say nothing about the content.
    gold_implication: >-
      Ask the agency for the page or token limit of the pre-screen, and resubmit the shorter
      proposal at 40 pages to see whether the flat 3.5 pattern disappears.
    ingredients_a:
      - both evaluation summary reports arrived on 14 September with 3.5 on all three criteria
      - the two proposals differ a lot in content and both are 61 pages
      - the summaries contain no criterion-specific comments
    ingredients_b:
      - the client's judge model returns 3.5 on every criterion when an item exceeds about 12,000 tokens
      - a 61-page PDF is roughly 40,000 tokens
      - the flat 3.5 rows have empty rationale fields
    forbidden_phrases_a: [judge, token, context limit, automated, screening artifact, flat output]
    forbidden_phrases_b: [grant, proposal, agency, evaluation summary, 61 pages, flat scores]
    one_side_test: >-
      A alone supports "two proposals got oddly identical scores". B alone supports "a judge
      goes flat past a length limit". Only both connect the proposals' length to the flat scores.
  - id: br10
    domain_a: grants
    domain_b: mleval
    fact_type: vendor
    hidden_mechanism: EvalBench Pro re-normalises its scores across snapshots, so a 24-month deliverable defined as an EvalBench Pro score cannot be met or missed on its own terms
    gold_connection: >-
      The consortium deliverable "EvalBench Pro score above 70 at month 24" is undefined because
      EvalBench Pro re-normalised its scale between its 1 June and 1 September snapshots, moving
      the same unchanged model from 71 to 64; the deliverable must pin a snapshot.
    gold_implication: >-
      Amend the deliverable to name the 1 June 2026 EvalBench Pro snapshot and re-check the
      baseline number against that snapshot before submission.
    ingredients_a:
      - the coordinator wrote deliverable D3.2 as "EvalBench Pro score above 70 at month 24"
      - the baseline in the proposal is the current EvalBench Pro score of 71
      - the reviewer asked for a measurable target and this was the answer
    ingredients_b:
      - the same client model scored 71 on EvalBench Pro's 1 June snapshot and 64 on the 1 September snapshot
      - the model was not retrained or changed between the two dates
      - EvalBench Pro's notes say scores are re-normalised against the current model pool
    forbidden_phrases_a: [re-normalised, unstable, snapshot, pin the version, moving target]
    forbidden_phrases_b: [grant, deliverable, consortium, D3.2, target, moving target]
    one_side_test: >-
      A alone supports "a deliverable uses a vendor score". B alone supports "the vendor's scale
      moves". Only both show the deliverable is written on a scale that moves.
  - id: br11
    domain_a: grants
    domain_b: fraud
    fact_type: identifier
    hidden_mechanism: consecutive identifiers across entities that claim to be independent expose one operator
    gold_connection: >-
      Identifiers that run in sequence across supposedly independent parties expose a single
      operator, whether the identifiers are company registration numbers on two proposals or
      phone numbers across three accounts.
    gold_implication: >-
      Run an adjacency check on registration numbers across this call's applicants and on phone
      numbers across new signups, and list any run of three or more consecutive values.
    ingredients_a:
      - two proposals from different companies contain the same typo in the budget table heading
      - their company registration numbers are 2 apart
      - both list an incorporation date in the same week
    ingredients_b:
      - the forty destination numbers from last week's incident differ only in the last two digits, ascending
      - the three accounts that placed them were created within one hour
      - each account used a different name and a different email provider
    forbidden_phrases_a: [same operator, linked, collusion, sequential, adjacency]
    forbidden_phrases_b: [same operator, linked, sequential, adjacency, one person]
    one_side_test: >-
      A alone supports "two proposals look alike". B alone supports "an incident with odd
      numbers". Only both say consecutive identifiers reveal one hand behind separate fronts.
  - id: br12
    domain_a: grants
    domain_b: fraud
    fact_type: date
    hidden_mechanism: the consortium Slack export leaked on 22 July, and both the portal login attempt and the app's credential-stuffing burst at 03:10 that night came from the same network
    gold_connection: >-
      The unknown-device login on the grant portal at 03:12 on 22 July and the credential burst
      on the app at 03:10 the same night came from the same network block, two minutes apart,
      right after the consortium Slack export with both credentials was shared publicly.
    gold_implication: >-
      Rotate the portal password and the app admin token, and match the portal alert's network
      block against the app's fraud log for 22 July.
    ingredients_a:
      - the EU portal sent an unknown-device login alert for 22 July at 03:12 from network block 185.220.101
      - on 21 July a partner pasted the consortium Slack export, including a portal login, into a public channel
      - nobody in the consortium was awake at 03:12
    ingredients_b:
      - the app logged a credential-stuffing burst on 22 July starting 03:10, 1,200 attempts in nine minutes
      - the source network block was 185.220.101
      - the burst used the admin username from the internal Slack workspace
    forbidden_phrases_a: [same attacker, app, credential stuffing, fraud, both systems]
    forbidden_phrases_b: [grant, portal, EU, consortium, both systems, same attacker]
    one_side_test: >-
      A alone supports "a portal login attempt after a leak". B alone supports "a stuffing burst
      from one network". Only both put the same block at the same minute on two systems.
