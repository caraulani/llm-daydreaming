  - id: br14
    domain_a: grants
    domain_b: health
    fact_type: vendor
    hidden_mechanism: Eurofins changed reporting units between March and June, and the clinical substudy subcontracted to Eurofins over 24 months would inherit the same unit switch mid-series
    gold_connection: >-
      The lab subcontracted for the grant's 24-month substudy is the same Eurofins whose personal
      panel switched from mg/dL to mmol/L between March and June without notice; the substudy's
      longitudinal data would suffer the same mid-series unit change unless the contract fixes
      units.
    gold_implication: >-
      Add a fixed-units clause naming mmol/L to the Eurofins subcontract before the consortium
      agreement is signed.
    ingredients_a:
      - the clinical substudy in work package 4 is subcontracted to Eurofins for 24 monthly panels
      - the subcontract template has no clause on reporting format
      - the data management plan assumes one consistent unit per marker
    ingredients_b:
      - the March personal panel from Eurofins reports glucose in mg/dL, the June one in mmol/L
      - no notice of the change came with the June report
      - the tracker chart shows a fake drop because it read both as the same unit
    forbidden_phrases_a: [units, mg/dL, mmol/L, unit switch, personal panel, inconsistent]
    forbidden_phrases_b: [grant, substudy, subcontract, work package, contract, inconsistent]
    one_side_test: >-
      A alone supports "a subcontract lacks a format clause". B alone supports "one lab changed
      units on me". Only both name the same lab on both sides.
