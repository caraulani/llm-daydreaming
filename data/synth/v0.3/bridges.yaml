  - id: br18
    domain_a: iot
    domain_b: fraud
    fact_type: identifier
    hidden_mechanism: the fraud signups' phone numbers sit in the Telsim M2M range that the workshop's own sensor SIMs come from, so they are data-only SIMs that cannot receive a voice call
    gold_connection: >-
      The signup numbers that pass SMS verification but never answer a call belong to Telsim's
      machine-to-machine range 6 22 34 xx, the same range printed on the workshop's sensor SIMs,
      which are data-only and cannot take a voice call by design.
    gold_implication: >-
      Block the Telsim M2M number range at signup and re-check the last month's unanswered
      verification calls against it.
    ingredients_a:
      - the workshop's six LTE sensor SIMs are from Telsim, numbers starting 6 22 34
      - the Telsim pack says the SIMs are machine-to-machine, data and SMS only
      - a voice call to one of them returns "number not in service"
